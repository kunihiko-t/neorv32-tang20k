# 生成済みmww書き込み行($env(MWW_WORDS))でIMEM/DMEMへ配置し、pc=0から実行する。
# `load_image`のprogram-buffer経路がbusy失敗するため、abstract-accessで書く。
# 前提: フラッシュのNEORV32が通常起動済みであること(S2なしでUSB挿入、8秒待機)。
set HERE [file dirname [file normalize [info script]]]
set REPO [file normalize [file join $HERE .. ..]]
source [file join $REPO script ocd target.cfg]
target_setup 1
# `target curstate`はこのDTMで失敗して後続を巻き込むため使わない。
# halt自体の成否は後段の全語検証が保証する。
catch {halt}
after 500
source $env(MWW_WORDS)
proc mrw {reg} { set v ""; mem2array v 32 $reg 1; return $v(0) }
# 読み取り自体が散発的に嘘をつくため、1回の不一致では書かない。
# 3回読んで2回以上不一致の語だけ書き直し、書き直し後は3回読んで1回でも一致すれば合格とする。
proc words_match {a w n} {
    set hits 0
    for {set i 0} {$i < $n} {incr i} {
        if {![catch {set v [mrw $a]}]} {
            if {$v == $w} { incr hits }
        }
    }
    return [expr {$hits * 2 > $n}]
}
set failed 0
foreach pair $PAIRS {
    set a [lindex $pair 0]
    set w [lindex $pair 1]
    if {[words_match $a $w 3]} { continue }
    for {set r 0} {$r < 4} {incr r} {
        after 100
        catch {mww $a $w}
        riscv dmi_write 0x16 0x700
        if {[words_match $a $w 3]} { break }
    }
    if {![words_match $a $w 3]} {
        echo [format "FAILED addr=%08x" $a]
        incr failed
    }
}
echo [format "unmatched=%d" $failed]
shutdown
