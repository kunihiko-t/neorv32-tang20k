# 生成済みmww書き込み行($env(MWW_WORDS))でIMEM/DMEMへ配置し、pc=0から実行する。
# `load_image`のprogram-buffer経路がbusy失敗するため、abstract-accessで書く。
# 前提: フラッシュのNEORV32が通常起動済みであること(S2なしでUSB挿入、8秒待機)。
set HERE [file dirname [file normalize [info script]]]
set REPO [file normalize [file join $HERE .. ..]]
source [file join $REPO script ocd target.cfg]
target_setup 1
halt
wait_halt 3000
halt
source $env(MWW_WORDS)
proc mrw {reg} { set v ""; mem2array v 32 $reg 1; return $v(0) }
# DMIのcmderr固着で後続が全滅するため、1語ずつ検証し不一致だけ書き直す。
# 書き込み失敗はcatchし、abstractcs(0x16)へ1を書いて固着を解除する。
foreach pair $PAIRS {
    set a [lindex $pair 0]
    set w [lindex $pair 1]
    for {set r 0} {$r < 8} {incr r} {
        set ok 0
        if {![catch {set v [mrw $a]}]} {
            if {$v == $w} { set ok 1; break }
        }
        catch {mww $a $w}
        riscv dmi_write 0x16 0x700
    }
    set ok 0
    if {![catch {set v [mrw $a]}]} {
        if {$v == $w} { set ok 1 }
    }
    if {!$ok} {
        echo [format "FAILED addr=%08x" $a]
        exit 1
    }
}
echo "STATE:"
reg pc
echo [format "w0=%08x gpio_out=%08x uartctrl=%08x" [mrw 0] [mrw 0xfffc0004] [mrw 0xfff50000]]
reg pc 0
resume
shutdown
