# NEORV32へminios_helloを書き込み、pc=0から実行する。
# 前提: フラッシュのNEORV32が通常起動済みであること(S2なしでUSB挿入、8秒待機)。
# 既にhelloが走ってwfi待機中だとload_imageがbusy失敗するため、先にreset haltする。
set HERE [file dirname [file normalize [info script]]]
set REPO [file normalize [file join $HERE .. ..]]
source [file join $REPO script ocd target.cfg]
target_setup 1
reset halt
load_image [file join $REPO sw minios_hello build minios_hello.elf]
reg pc 0
resume
after 3000
halt
proc mrw {reg} { set v ""; mem2array v 32 $reg 1; return $v(0) }
echo "STATE:"
reg pc
echo [format "gpio_in=%08x gpio_out=%08x uartctrl=%08x" [mrw 0xfffc0000] [mrw 0xfffc0004] [mrw 0xfff50000]]
resume
shutdown
